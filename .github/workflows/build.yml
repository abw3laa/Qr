name: QR Card Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qr-card-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_WEB_BASE_URL: https://qrcard-jjdar3fj.manus.space

jobs:
  validate:
    name: Validate TypeScript, lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test

  web:
    name: Export web build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare NativeWind web cache
        run: mkdir -p node_modules/react-native-css-interop/.cache && touch node_modules/react-native-css-interop/.cache/web.css
      - name: Export web
        run: pnpm exec expo export --platform web
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-card-web
          path: dist
          if-no-files-found: error

  android:
    name: Build installable Android APK with Gradle
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate native Android project
        run: CI=1 pnpm exec expo prebuild --platform android --no-install
      - name: Build standalone release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify JavaScript bundle is embedded
        working-directory: android
        run: |
          set -e
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          unzip -l "$apk" | grep -E 'assets/.*(index|bundle).*\\.js|index\\.android\\.bundle' >/dev/null
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-card-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Publish APK to GitHub Release
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [web, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: qr-card-android-apk
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: QR Card v1.0.${{ github.run_number }}
          generate_release_notes: true
          body: "نسخة Android مستقلة قابلة للتثبيت من مشروع QR Card، وتتضمن حزمة JavaScript داخل APK."
          files: release-assets/app-release.apk
